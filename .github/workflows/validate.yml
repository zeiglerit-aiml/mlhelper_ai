name: validate-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged source archive
        run: tar -tzf continuous-ai-mlops.tar.gz >/dev/null
